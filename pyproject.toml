[project]
name = "hermes-fedora-host"
version = "0.1.0"
description = "Hermes deployment work for a Fedora host, developed on the dev-toolbox standard."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.16.8",
  "ty>=0.0.82",
  "yamllint>=1.38.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
