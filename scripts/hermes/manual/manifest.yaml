# Manual-profile release manifest.
#
# This is the reviewed identity of one manual-profile release. It is deliberately
# separate from the controller/unattended promotion records: it carries no
# certification claim and does not authorize deployment.
#
# Digests below were read from public registry metadata on 2026-09-25 UTC, and the
# revision was corroborated by the release tag and the image revision label. That
# is metadata corroboration, not signature verification: the upstream Git tag is
# unsigned. Dependencies (the Fedora worker base) move independently of the
# gateway image, so a worker candidate must be rebuilt and retained per release.
