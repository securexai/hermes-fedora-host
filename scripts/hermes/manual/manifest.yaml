  release: v2026.9.11
  application_version: 0.21.2
  revision: 939e45c91d751fadd94dcd1b873ac3cb44846213
  revision_evidence: image org.opencontainers.image.revision label, corroborated by the release tag
  tag_signed: false

images:
  gateway:
    ref: docker.io/nousresearch/hermes-agent@sha256:9469b3e78b9545b6d576eb8887a95352e9a0ea83730eaf31431cf862ca1010e1
    index_digest: sha256:9469b3e78b9545b6d576eb8887a95352e9a0ea83730eaf31431cf862ca1010e1
    amd64_manifest: sha256:930b5b8ebfed43857c3a993f437f0e3a1bffc045c5b241794b35bf102298bdb2
    upstream_user: root
    runtime_user: "10000:10000"
    verification: public registry metadata only; no cosign or signature verification performed
  worker:
