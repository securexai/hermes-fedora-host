# .pre-commit-config.yaml - dev-toolbox enforcement baseline
#
# Installed by `bootstrap-repo.sh` from the dev-toolbox container into any
# target git repository. Mirrors the enforcement set documented in
# dev-toolbox/README.md and the global CLAUDE.md.
#
# Install hooks (once per clone):
#   pre-commit install --install-hooks
# Audit the worktree:
#   pre-commit run --all-files
# Bump pinned revisions:
#   pre-commit autoupdate

# Hooks fire at the pre-commit, commit-msg and pre-push stages. pre-push runs
# this repository's ported Hermes gate (see docs/hook-parity.md).
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # ---------------------------------------------------------------------------
  # Baseline hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Byte-preserved migration records are bound to the SHA-256 values
      # recorded in PROVENANCE.md and docs/migration-manifest.txt. The
      # auto-fixing hooks must never rewrite them: an early `--all-files` pass
      # silently removed a meaningful trailing space from a documented `sudo`
      # command in docs/HERMES_MANUAL_DEPLOYMENT_GUIDE.md, and a formatter run
      # stripped the final blank line of the canonical correction record,
      # breaking its recorded provenance hash.
      #
      # The list is exact. It previously used `docs/HERMES_` and dated-plan
      # wildcards, which also exempted the maintained guides
      # (docs/VM_TESTING_GUIDE.md, docs/HERMES_UNATTENDED_DEPLOYMENT.md). Those
      # are maintained here and are intentionally no longer excluded: they are
      # linted (check-only) rather than blanket-exempted. Secret scanning
      # deliberately still covers every path; only the rewriting hooks are
      # scoped out.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &preserved_evidence '^(docs/plans/evidence/|docs/reviews/|docs/archive/|docs/plans/2026-09-07-hermes-unattended\.md|docs/plans/2026-09-12-fedora-44-hermes-preparation-guide\.md|docs/plans/2026-09-12-fedora-ssh-key-only\.md|docs/plans/2026-09-18-hermes-local-installation\.md|docs/plans/2026-09-18-hermes-local-vm\.md|docs/plans/2026-09-20-hermes-manual-gate2-lab-plan\.md|docs/plans/2026-09-20-hermes-manual-profile-improvement\.md|docs/plans/2026-09-20-hermes-manual-review-corrections\.md|docs/HERMES_B6_CLEAN_INSTALL_HANDOFF\.md|docs/HERMES_BOOT_AUTOMATION\.md|docs/HERMES_BOOT_CLEAN_INSTALL\.md|docs/HERMES_DEPLOYMENT_PLAN\.md|docs/HERMES_INSTALLATION_VERIFICATION\.md|docs/HERMES_LOCAL_VM\.md|docs/HERMES_MANUAL_DEPLOYMENT_GUIDE\.md|docs/HERMES_MANUAL_HANDOFF\.md|docs/HERMES_MANUAL_PROFILE_CONTRACT\.md|docs/HERMES_MEMORY_APPROVAL\.md|docs/HERMES_ONE_COMMAND_DEPLOYMENT_HANDOFF\.md|docs/HERMES_REMAINING_LAB_TESTS\.md|docs/HERMES_SELINUX_TPM_REPAIR\.md|docs/HERMES_TELEGRAM_BOT_GUIDE\.md|docs/HERMES_TPM_DEPENDENCY_REVIEW\.md|scripts/hermes/manual/README\.md)'
      - id: end-of-file-fixer
        exclude: *preserved_evidence
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *preserved_evidence
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master
          - --branch=develop
          - --pattern=^release/.*

  # ---------------------------------------------------------------------------
  # Secret detection - betterleaks (upstream hosted hook).
  # The hook entry is fixed by upstream as
  #   betterleaks git --pre-commit --redact --staged --verbose
  # so do NOT override `args` here. Config lives in .betterleaks.toml.
  #
  # This hook is a STAGED scan. On a working tree with nothing staged it scans
  # zero bytes, so a green run says nothing about imported or untracked files.
  # The full-working-tree, non-writing scan (with a synthetic positive control
  # and live validation disabled) is `toolbox/scan-secrets.sh`, run by both the
  # offline gate and certification. Do not treat this hook as full coverage.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.1.2
    hooks:
      - id: betterleaks

  # ---------------------------------------------------------------------------
  # Conventional Commits - commitlint (commit-msg stage).
  # Isolated node env via additional_dependencies; no global install required.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - '@commitlint/cli@19.5.0'
          - '@commitlint/config-conventional@19.5.0'

  # ---------------------------------------------------------------------------
  # Shell linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # This hook is the repository's error-only gate. The migrated Hermes
        # scripts are a preserved review artifact and carry pre-existing
        # findings that were never gated upstream (the source review record
        # states shellcheck was absent and lint was NOT RUN): 10 warnings
        # (SC2034 x5, SC2221/SC2222, SC2154, SC2115, SC2043) and 72 info-level
        # notes. Remediating those is a follow-up in this repository.
        #
        # This weakening is deliberately NOT inherited by certification:
        # toolbox/run-check-only-lint.sh runs shellcheck at its default severity
        # over the certifier's original reviewed file set, so the promoted gate
        # keeps the coverage the source certifier had.
        args: [--severity=error]

  # ---------------------------------------------------------------------------
  # Markdown linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # ---------------------------------------------------------------------------
  # Shell formatting - check only. Reuses the Fedora RPM shfmt baked into the
  # dev-toolbox image so every developer machine and CI run the identical
  # version. `-d` prints a diff and exits non-zero, so files are never
  # rewritten. ShellSpec spec files are excluded.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt (check only)
        entry: shfmt -d -l -i 2 -ci -bn
        language: system
        files: \.sh$
        exclude: ^(spec/|scripts/hermes/manual/lab/gate2-test-)

  # ---------------------------------------------------------------------------
  # Ported Hermes gate (pre-push). The source repository used Lefthook; its
  # pre-push suites are ported here. This runs the same entrypoint developers
  # and the certifier's check-only gate use, so a green local push means the same
  # offline set ran. `toolbox/run-offline-checks.sh` runs the guide suite
  # (`tests/test-hermes-guide.sh`), the ShellSpec deployment/VM specs and the
  # explicitly reviewed Python unit allowlist. It does not run live/VM or
  # network suites. See docs/hook-parity.md.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: hermes-offline-suites
        name: Hermes offline suites (pre-push)
        entry: bash toolbox/run-offline-checks.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
