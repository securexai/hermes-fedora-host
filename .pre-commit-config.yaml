# .pre-commit-config.yaml - dev-toolbox enforcement baseline
#
# Installed by `bootstrap-repo.sh` from the dev-toolbox container into any
# target git repository. Mirrors the enforcement set documented in
# dev-toolbox/README.md and the global CLAUDE.md.
#
# Install hooks (once per clone):
#   pre-commit install --install-hooks
# Audit the worktree:
#   pre-commit run --all-files
# Bump pinned revisions:
#   pre-commit autoupdate

# Hooks fire at the pre-commit, commit-msg and pre-push stages. pre-push runs
# this repository's ported Hermes gate (see docs/hook-parity.md).
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # ---------------------------------------------------------------------------
  # Baseline hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master
          - --branch=develop
          - --pattern=^release/.*

  # ---------------------------------------------------------------------------
  # Secret detection - betterleaks (upstream hosted hook).
  # The hook entry is fixed by upstream as
  #   betterleaks git --pre-commit --redact --staged --verbose
  # so do NOT override `args` here. Config lives in .betterleaks.toml.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.1.2
    hooks:
      - id: betterleaks

  # ---------------------------------------------------------------------------
  # Conventional Commits - commitlint (commit-msg stage).
  # Isolated node env via additional_dependencies; no global install required.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - '@commitlint/cli@19.5.0'
          - '@commitlint/config-conventional@19.5.0'

  # ---------------------------------------------------------------------------
  # Shell linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # The migrated Hermes scripts are a preserved review artifact and carry
        # pre-existing findings that were never gated upstream (the source
        # review record states shellcheck was absent and lint was NOT RUN).
        # As the template advises for legacy code not yet cleaned up, gate on
        # errors only. Inherited findings: 10 warnings (SC2034 x5, SC2221/SC2222,
        # SC2154, SC2115, SC2043) and 72 info-level notes. Remediating them is a
        # follow-up in this repository, not part of a preservation migration.
        args: [--severity=error]

  # ---------------------------------------------------------------------------
  # Markdown linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # ---------------------------------------------------------------------------
  # Shell formatting - check only. Reuses the Fedora RPM shfmt baked into the
  # dev-toolbox image so every developer machine and CI run the identical
  # version. `-d` prints a diff and exits non-zero, so files are never
  # rewritten. ShellSpec spec files are excluded.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt (check only)
        entry: shfmt -d -l -i 2 -ci -bn
        language: system
        files: \.sh$
        exclude: ^spec/

  # ---------------------------------------------------------------------------
  # Ported Hermes gate (pre-push). The source repository used Lefthook; its
  # pre-push suites are ported here. This runs the same entrypoint CI uses, so a
  # green local push means the same thing as a green CI run. The whole-repository
  # `test-hermes-guide.sh` is intentionally absent: it asserts the runtime and
  # deployment assets that are out of scope. See docs/hook-parity.md.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: hermes-offline-suites
        name: Hermes offline suites (pre-push)
        entry: bash toolbox/run-offline-checks.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
