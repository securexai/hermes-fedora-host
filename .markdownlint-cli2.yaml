# .markdownlint-cli2.yaml - dev-toolbox enforcement baseline
# Aligned with the doc-standards skill. Used by the markdownlint-cli2
# pre-commit hook.

config:
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
    headings: false
  MD024:
    allow_different_nesting: true
    siblings_only: true
  # Inline HTML - scoped allowlist (per doc-standards skill). Do not disable
  # globally; a blanket disable would admit <script>, <iframe>, etc.
  MD033:
    allowed_elements:
      - br
      - details
      - summary
      - sub
      - sup
      - kbd
      - img
  MD040: true
  MD045: true
  MD047: true
  MD051: true
  MD053: true
  MD056: true
  MD059: true
  MD060: false

ignores:
  - "node_modules/**"
  - ".devbox/**"
  - "vendor/**"
  - "docs/archive/**"
  # Preserved migration artifacts, kept byte-for-byte so their recorded SHA-256
  # values in PROVENANCE.md and docs/extraction-manifest.txt stay accurate.
  # Reformatting them would silently rewrite the evidence they exist to record.
  # They carry a small number of inherited MD013 over-length lines; see the
  # migration record for the exact list and the follow-up.
  - "docs/HERMES_*.md"
  - "docs/reviews/**"
  - "docs/plans/2026-09-20-hermes-manual-*.md"
  - "docs/plans/evidence/**"

fix: true
