# .markdownlint-cli2.yaml - dev-toolbox enforcement baseline
# Aligned with the doc-standards skill. Used by the markdownlint-cli2
# pre-commit hook.

config:
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
    headings: false
  MD024:
    allow_different_nesting: true
    siblings_only: true
  # Inline HTML - scoped allowlist (per doc-standards skill). Do not disable
  # globally; a blanket disable would admit <script>, <iframe>, etc.
  MD033:
    allowed_elements:
      - br
      - details
      - summary
      - sub
      - sup
      - kbd
      - img
  MD040: true
  MD045: true
  MD047: true
  MD051: true
  MD053: true
  MD056: true
  MD059: true
  MD060: false

ignores:
  - "node_modules/**"
  - ".devbox/**"
  - "vendor/**"
  - "docs/archive/**"

fix: true
